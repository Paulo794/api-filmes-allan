version: '3.8'

services:
  catalogo:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: catalogo_tom_hanks
    ports:
      - "3001:3001" # Ponto de entrada público único
    networks:
      - tom_hanks_net
    environment:
      - AUTH_SERVICE_URL=http://auth-service:3000
      - PORT=${PORT}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - TMDB_API_KEY=${TMDB_API_KEY}
      - JWT_SECRET=${JWT_SECRET}

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: auth_tom_hanks
    # SEM PORTS - Acesso apenas interno
    networks:
      - tom_hanks_net
    environment:
      - PORT=${PORT}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - JWT_SECRET=${JWT_SECRET}
      - MAILTRAP_HOST=${MAILTRAP_HOST}
      - MAILTRAP_PORT=${MAILTRAP_PORT}
      - MAILTRAP_USER=${MAILTRAP_USER}
      - MAILTRAP_PASS=${MAILTRAP_PASS}

networks:
  tom_hanks_net:
    driver: bridge
