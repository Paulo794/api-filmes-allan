version: '3.8'

services:
  catalogo:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: catalogo_tom_hanks
    ports:
      - "8224:3001" # Porta 8224 exposta para a rede da faculdade
    networks:
      - tom_hanks_net
    environment:
      - AUTH_SERVICE_URL=http://auth-service:3000
      - LOG_SERVICE_URL=http://log-service:3002
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN}
      - PORT=${PORT}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - TMDB_API_KEY=${TMDB_API_KEY}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      auth-service:
        condition: service_healthy
    restart: unless-stopped

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: auth_tom_hanks
    # SEM PORTS - Acesso apenas interno
    networks:
      - tom_hanks_net
    environment:
      - AUTH_PORT=3000
      - LOG_SERVICE_URL=http://log-service:3002
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - JWT_SECRET=${JWT_SECRET}
      - MAILTRAP_HOST=${MAILTRAP_HOST}
      - MAILTRAP_PORT=${MAILTRAP_PORT}
      - MAILTRAP_USER=${MAILTRAP_USER}
      - MAILTRAP_PASS=${MAILTRAP_PASS}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  log-service:
    build:
      context: ./log-service
      dockerfile: Dockerfile
    container_name: log_tom_hanks
    networks:
      - tom_hanks_net
    environment:
      - LOG_PORT=3002
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - AUDIT_STREAM_MAXLEN=${AUDIT_STREAM_MAXLEN}
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3002/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: redis_tom_hanks
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    networks:
      - tom_hanks_net
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

networks:
  tom_hanks_net:
    driver: bridge

volumes:
  redis_data:
